# Actualizar fotocuadrantes/ desde el fork del Quadrat Cropper.
#
# El código de la herramienta se desarrolla en
#   https://github.com/gonzalobravoargentina/quadrat-cropper-js
# y este sitio solo guarda la copia publicada (index.html, css/, js/, vendor/).
#
# Uso: pestaña Actions → "Actualizar fotocuadrantes" → Run workflow.
# Abre un PR con los cambios; al mergearlo, GitHub Pages publica
# https://culturaoceanica.org/fotocuadrantes/
#
# Requiere (una sola vez): Settings → Actions → General → Workflow permissions →
# "Read and write permissions" + "Allow GitHub Actions to create and approve
# pull requests".

name: Actualizar fotocuadrantes

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo de origen (owner/nombre)"
        default: "gonzalobravoargentina/quadrat-cropper-js"
        required: true
      ref:
        description: "Rama, tag o commit a publicar"
        default: "culturaoceanica"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del sitio
        uses: actions/checkout@v4

      - name: Bajar la herramienta
        run: |
          git clone --quiet "https://github.com/${{ inputs.repo }}.git" /tmp/src
          git -C /tmp/src checkout --quiet "${{ inputs.ref }}"
          echo "SHA=$(git -C /tmp/src rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VERSION=$(grep -oE "VERSION = '[^']+'" /tmp/src/js/qd.js | cut -d"'" -f2)" >> "$GITHUB_ENV"

      - name: Copiar a fotocuadrantes/
        run: |
          mkdir -p fotocuadrantes
          # solo lo que se publica; se borra antes para no dejar archivos viejos
          rm -rf fotocuadrantes/index.html fotocuadrantes/css fotocuadrantes/js fotocuadrantes/vendor
          cp -R /tmp/src/index.html /tmp/src/css /tmp/src/js /tmp/src/vendor fotocuadrantes/
          printf 'Quadrat Cropper v%s\nOrigen: %s @ %s (%s)\nActualizado: %s\n' \
            "$VERSION" "${{ inputs.repo }}" "${{ inputs.ref }}" "$SHA" "$(date -u +%F)" \
            > fotocuadrantes/VERSION.txt

      - name: Abrir PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: actualizar-fotocuadrantes
          delete-branch: true
          commit-message: "fotocuadrantes: Quadrat Cropper v${{ env.VERSION }} (${{ env.SHA }})"
          title: "Actualizar fotocuadrantes a v${{ env.VERSION }} (${{ env.SHA }})"
          body: |
            Copia de `${{ inputs.repo }}` en `${{ inputs.ref }}` (commit ${{ env.SHA }}): `index.html`, `css/`, `js/`, `vendor/`.

            Al mergear se publica en https://culturaoceanica.org/fotocuadrantes/
          add-paths: fotocuadrantes
