<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultura Oceánica — Ciencia del Mar Argentino</title>
<meta name="description" content="Plataforma de ciencia y educación marina del Mar Argentino. Guía de especies submarinas, visor de rodolitos y más.">
<link rel="stylesheet" href="/assets/co-theme.css">
<style>

/* ── RESET / BASE ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden; /* single-screen, no scroll */
  font-family: var(--co-font-body);
  background: var(--co-navy);
  color: var(--co-white);
}

/* ── HERO — full viewport ─────────────────────────────────── */
.hero {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Photo background — place /assets/hero-home.jpg for full effect */
.hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('/assets/hero-home.jpg');
  background-size: cover;
  background-position: center 40%;
  /* Gradient fallback when no photo is set */
  background-color: #031526;
  transform: scale(1.04);
  transition: transform 12s ease-out;
  will-change: transform;
}
.hero-bg.loaded { transform: scale(1); }

/* Dark overlay — deepens towards bottom */
.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to bottom,
      rgba(2, 8, 18, 0.55) 0%,
      rgba(2, 8, 18, 0.30) 35%,
      rgba(2, 8, 18, 0.55) 70%,
      rgba(2, 8, 18, 0.88) 100%
    );
}

/* Vignette — darkens edges */
.hero-vign {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(1, 5, 12, 0.72) 100%);
}

/* ── PARTICLES canvas ─────────────────────────────────────── */
#particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* sitenav override for home — position absolute (not fixed) */
.sitenav { position: absolute; background: transparent; border-bottom: none; }

/* ── WORDMARK — centered ──────────────────────────────────── */
.wordmark {
  position: relative;
  z-index: 10;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
.wordmark-top {
  font-family: var(--co-font-display);
  font-size: clamp(3.5rem, 10vw, 7rem);
  font-weight: 300;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(220, 240, 255, 0.90);
  line-height: 1;
}
.wordmark-bottom {
  font-family: var(--co-font-display);
  font-size: clamp(3.5rem, 10vw, 7rem);
  font-weight: 900;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--co-white);
  line-height: 1.05;
}
.wordmark-rule {
  width: 44px;
  height: 2px;
  background: var(--co-teal);
  margin: 18px auto 14px;
  opacity: 0.7;
}
.wordmark-sub {
  font-family: var(--co-font-display);
  font-size: clamp(.65rem, 1.5vw, .82rem);
  font-weight: 400;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(140, 200, 220, 0.70);
}

/* ── PORTAL CARDS — bottom right ─────────────────────────── */
.portals {
  position: absolute;
  bottom: 56px;
  right: var(--co-pad-x);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 280px;
}
.portal {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 18px 24px 20px;
  background: rgba(10, 25, 50, 0.55);
  border: 0.5px solid rgba(0, 201, 212, 0.20);
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background .2s, border-color .2s, transform .2s;
  cursor: pointer;
}
.portal:hover {
  background: rgba(0, 201, 212, 0.10);
  border-color: rgba(0, 201, 212, 0.45);
  transform: translateY(-3px);
}
.portal-eyebrow {
  font-family: var(--co-font-display);
  font-size: .60rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--co-teal);
  opacity: .8;
}
.portal-name {
  font-family: var(--co-font-display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--co-white);
  line-height: 1.2;
}
.portal-desc {
  font-size: .78rem;
  color: var(--co-text-dim);
  margin-top: 2px;
  line-height: 1.4;
}
.portal-arrow {
  margin-top: 10px;
  font-size: .75rem;
  color: var(--co-teal);
  font-family: var(--co-font-display);
  letter-spacing: 1px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.portal-arrow::after {
  content: '';
  display: block;
  width: 20px;
  height: 1px;
  background: var(--co-teal);
  transition: width .2s;
}
.portal:hover .portal-arrow::after { width: 32px; }

/* ── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width: 600px) {
  .portals {
    bottom: 24px;
    right: 20px;
    width: calc(100vw - 40px);
  }
  .portal { padding: 12px 16px 14px; }
  .portal-desc { display: none; }
}

/* ── FADE IN ──────────────────────────────────────────────── */
@keyframes fadein {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.wordmark  { animation: fadein .9s ease both; animation-delay: .15s; }
.portals   { animation: fadein .9s ease both; animation-delay: .40s; }
.sitenav   { animation: fadein .6s ease both; }

</style>
</head>
<body>

<div class="hero">

  <!-- Background photo + overlays -->
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-vign"></div>

  <!-- Particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Top nav — same format as guide/rodolitos -->
  <nav class="sitenav">
    <a class="sitenav-brand" href="/">CULTURA <span>OCEÁNICA</span></a>
    <div class="sitenav-links">
      <a href="/guia/">Guía</a>
      <a href="/rodolitos/">Rodolitos</a>
    </div>
  </nav>

  <!-- Centered wordmark -->
  <div class="wordmark">
    <div class="wordmark-top">Cultura</div>
    <div class="wordmark-bottom">Oceánica</div>
    <div class="wordmark-rule"></div>
    <div class="wordmark-sub">Mar Argentino</div>
  </div>

  <!-- Portal navigation cards -->
  <div class="portals">
    <a class="portal" href="/guia/">
      <div class="portal-eyebrow">Explorar</div>
      <div class="portal-name">Guía de Especies</div>
      <div class="portal-desc">Algas, peces e invertebrados documentados en fondos del Mar Argentino</div>
      <div class="portal-arrow">Ingresar</div>
    </a>
    <a class="portal" href="/rodolitos/">
      <div class="portal-eyebrow">Visualizar</div>
      <div class="portal-name">Visor de Rodolitos</div>
      <div class="portal-desc">Explorador 3D de morfología de rodolitos del Mar Argentino</div>
      <div class="portal-arrow">Ingresar</div>
    </a>
  </div>


</div>

<script>
/* ── Background parallax trigger ───────────────────────── */
document.getElementById('heroBg').classList.add('loaded');

/* ── Particles — floating bubbles ──────────────────────── */
(function() {
  const canvas  = document.getElementById('particles');
  const ctx     = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Particle() {
    this.reset(true);
  }
  Particle.prototype.reset = function(init) {
    this.x    = Math.random() * W;
    this.y    = init ? Math.random() * H : H + 10;
    this.r    = Math.random() * 2.2 + 0.4;
    this.vy   = -(Math.random() * 0.4 + 0.15);
    this.vx   = (Math.random() - 0.5) * 0.18;
    this.a    = Math.random() * 0.28 + 0.05;
    this.phase = Math.random() * Math.PI * 2;
  };
  Particle.prototype.update = function(t) {
    this.y += this.vy;
    this.x += this.vx + Math.sin(t * 0.0006 + this.phase) * 0.12;
    if (this.y < -6) this.reset(false);
  };
  Particle.prototype.draw = function() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 201, 212, ${this.a})`;
    ctx.fill();
  };

  function init() {
    resize();
    particles = Array.from({length: 55}, () => new Particle());
  }

  let raf;
  function loop(t) {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(t); p.draw(); });
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
